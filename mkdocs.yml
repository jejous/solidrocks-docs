site_name: SolidRocks Documentation
site_description: Documentation for the SolidRocks render optimizers
site_author: Jerome Prevost
# A remplacer par l'adresse reelle une fois le depot cree (ou par le domaine personnel plus tard).
site_url: https://jejous.github.io/solidrocks-docs/
copyright: Copyright &copy; 2026 Jerome Prevost

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - SolidRocks for Cycles (Blender):
      - Overview: blender/index.md
      - Getting started:
          - Installation: blender/installation.md
          - Quick start: blender/quick-start.md
      - The panel:
          - Main controls: blender/main-controls.md
          - Optim tab: blender/optim.md
          - Create tab: blender/create.md
          - Tune tab: blender/tune.md
          - Preset tab: blender/preset.md
      - FAQ & known pitfalls: blender/faq.md
